<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple JS Interactions</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Simple JS Project</h1>

  <div class="container">
    <button id="toggleImageBtn">Hide Image</button>
    <button id="toggleTextBtn">Hide Text</button>

    <div id="imageDiv">
      <img src="https://assets.cityexperiences.com/wp-content/uploads/2022/08/golden-gate-bridge-sf-e1666363524869.jpg"
           alt="Golden Gate Bridge"
           width="300">
    </div>

    <p id="textPara">
      This is a simple JavaScript project that shows and hides an image or text using buttons.
    </p>
  </div>

  <script src="script.js"></script>
</body>
</html>
